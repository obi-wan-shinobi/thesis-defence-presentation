experiment:
  name: ntk_spectral_bias_architecture_comparison
  save_dir: results
  seed: 0
data:
  n_train: 256
  n_eval: 2048
  train_grid: equally_spaced
target:
  terms:
  - freq: 1
    amp: 1.0
    basis: cos
  - freq: 2
    amp: 0.8
    basis: cos
  - freq: 3
    amp: 0.6
    basis: sin
  - freq: 6
    amp: 0.35
    basis: sin
  - freq: 7
    amp: 0.25
    basis: cos
train:
  steps: 10000
  lr: 0.0001
  eval_every: 50
  log_every: 500
sweep:
  seeds: 1
models:
- name: mlp_single_layer
  type: mlp
  width: 2048
  depth_hidden: 1
  b_std: 1.0
  parameterization: ntk
- name: mlp_deep_3_layer
  type: mlp
  width: 1024
  depth_hidden: 3
  b_std: 1.0
  parameterization: ntk
  lr_scale: 0.1
- name: attention_block
  type: attention
  d_model: 256
  n_heads: 4
  d_key: 64
  n_chan_val: 256
  b_std: 1.0
  parameterization: ntk
  linear_scaling: true
  attention_mechanism: SOFTMAX
